server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: souflow-api
  
  # Kéo cấu hình từ file .env bên ngoài (nếu có)
  config:
    import: optional:file:.env[.properties]
    
  # Cấu hình kết nối SQL Server
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:flower_shop};encrypt=true;trustServerCertificate=true;
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    
  # Cấu hình JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
        
  # Cấu hình Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:60000}
      
  # Tắt chữ Spring to đùng lúc chạy
  main:
    banner-mode: "off"

# Cấu hình chuỗi bảo mật JWT
jwt:
  secret: ${JWT_SECRET:change-me-to-a-secure-secret-key-at-least-256-bits-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Đường dẫn tài liệu API (Swagger)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Tối ưu Log: Ẩn rác của thư viện, chỉ hiện log cần thiết
logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{15} - %msg%n"
  level:
    root: WARN
    org:
      springframework: ERROR
      hibernate: ERROR
      apache:
        catalina: ERROR
    com:
      microsoft:
        sqlserver: ERROR # Tắt bớt log dài dòng của SQL Server driver
      zaxxer:
        hikari: ERROR
      # Bật log ở mức DEBUG cho code trong dự án của bạn
      souflow: DEBUG
app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
spring.application.name=api

# ===============================
# DATABASE CONFIGURATION (MS SQL SERVER)
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# SPRING DATA JPA & HIBERNATE
# ===============================
# Tự động cập nhật bảng (thêm cột, tạo bảng mới) dựa trên code Entity
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO